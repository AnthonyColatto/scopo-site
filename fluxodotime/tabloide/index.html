<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Estúdio de Tabloide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700;800;900&family=Montserrat:wght@400;600;800;900&family=Anton&family=Bebas+Neue&family=Poppins:wght@400;600;800;900&family=Barlow+Condensed:wght@500;700;800;900&family=Oswald:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Gotham da licença da SCOPO, servida junto com a página */
@font-face{font-family:"Gotham";src:url(fonts/gotham-thin.otf) format("opentype");font-weight:100;font-style:normal;font-display:block}
@font-face{font-family:"Gotham";src:url(fonts/gotham-light.otf) format("opentype");font-weight:300;font-style:normal;font-display:block}
@font-face{font-family:"Gotham";src:url(fonts/gotham-book.ttf) format("truetype");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"Gotham";src:url(fonts/gotham-medium.ttf) format("truetype");font-weight:500;font-style:normal;font-display:block}
@font-face{font-family:"Gotham";src:url(fonts/gotham-bold.otf) format("opentype");font-weight:700;font-style:normal;font-display:block}
@font-face{font-family:"Gotham";src:url(fonts/gotham-black.otf) format("opentype");font-weight:900;font-style:normal;font-display:block}
/* Layout: editor de três zonas — barra de modo no topo, painel de controle à esquerda, mesa de montagem à direita onde as lâminas ficam sobre um fundo neutro de prancheta. */
:root{
  --ui-bg:#eceef1; --ui-panel:#ffffff; --ui-sunk:#f5f6f8; --ui-ink:#1a1d23; --ui-mute:#5f6673; --ui-line:#dcdfe5;
  --ui-accent:#2a55e5; --ui-accent-ink:#ffffff; --ui-warn:#b4530a; --ui-warn-bg:#fff4e6; --ui-desk:#d9dce2;
  --ui-font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ui-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ui-bg:#15171b; --ui-panel:#1d2026; --ui-sunk:#23272e; --ui-ink:#e8eaee; --ui-mute:#9aa1ad; --ui-line:#30353e;
  --ui-accent:#6d8dff; --ui-accent-ink:#0c1020; --ui-warn:#f0a35c; --ui-warn-bg:#2d2116; --ui-desk:#0f1114; color-scheme:dark}}
:root[data-theme="dark"]{
  --ui-bg:#15171b; --ui-panel:#1d2026; --ui-sunk:#23272e; --ui-ink:#e8eaee; --ui-mute:#9aa1ad; --ui-line:#30353e;
  --ui-accent:#6d8dff; --ui-accent-ink:#0c1020; --ui-warn:#f0a35c; --ui-warn-bg:#2d2116; --ui-desk:#0f1114; color-scheme:dark}
html,body{height:100%}
body{background:var(--ui-bg);color:var(--ui-ink);font:14px/1.45 var(--ui-font);margin:0}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ui-accent);outline-offset:2px}

.app{display:grid;grid-template-rows:auto 1fr;height:100%}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--ui-panel);border-bottom:1px solid var(--ui-line);flex-wrap:wrap}
.brandmark{font-weight:600;letter-spacing:.01em;display:flex;align-items:center;gap:8px;min-width:0}
.brandmark i{width:18px;height:24px;border:2px solid var(--ui-ink);border-radius:2px;display:inline-block;position:relative}
.brandmark i::after{content:"";position:absolute;inset:3px 3px auto;height:6px;background:var(--ui-accent)}
.proj{border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:6px;width:220px;max-width:40vw;font-weight:500}
.proj:hover,.proj:focus{border-color:var(--ui-line);background:var(--ui-sunk)}
.seg{display:flex;background:var(--ui-sunk);border:1px solid var(--ui-line);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--ui-mute);font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ui-panel);color:var(--ui-ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.spacer{flex:1}
.btn{border:1px solid var(--ui-line);background:var(--ui-panel);padding:7px 12px;border-radius:7px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--ui-sunk)}
.btn.pri{background:var(--ui-accent);color:var(--ui-accent-ink);border-color:var(--ui-accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:#c43d3d}

.body{display:grid;grid-template-columns:380px 1fr;min-height:0}
.panel{background:var(--ui-panel);border-right:1px solid var(--ui-line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--ui-line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 10px;cursor:pointer;color:var(--ui-mute);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ui-ink);border-bottom-color:var(--ui-accent)}
.pbody{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:18px;min-height:0;flex:1}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ui-mute);font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:12px;color:var(--ui-mute)}
.f input[type=text],.f input[type=number],.f select,.f textarea{border:1px solid var(--ui-line);background:var(--ui-sunk);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
.f textarea{resize:vertical;min-height:64px}
.col{display:flex;align-items:center;gap:8px;border:1px solid var(--ui-line);background:var(--ui-sunk);border-radius:6px;padding:3px 6px}
.col input[type=color]{width:26px;height:22px;border:0;padding:0;background:none;cursor:pointer}
.col code{font:12px var(--ui-mono);color:var(--ui-mute)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.hint{font-size:12px;color:var(--ui-mute);margin:0}
.guide{font:12px/1.5 var(--ui-mono);background:var(--ui-sunk);border:1px dashed var(--ui-line);border-radius:6px;padding:8px 10px;color:var(--ui-mute)}
.guide b{color:var(--ui-ink);font-weight:500}
.drop{border:1.5px dashed var(--ui-line);border-radius:8px;padding:12px;display:flex;gap:10px;align-items:center;cursor:pointer;background:var(--ui-sunk)}
.drop:hover{border-color:var(--ui-accent)}
.drop .th{width:52px;height:40px;border-radius:4px;background:var(--ui-panel) center/contain no-repeat;border:1px solid var(--ui-line);flex:none}
.drop input{display:none}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.preset{border:1px solid var(--ui-line);border-radius:8px;background:var(--ui-panel);padding:6px 8px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:12.5px}
.preset i{width:14px;height:14px;border-radius:3px;display:inline-block}

.olist{display:flex;flex-direction:column;gap:6px}
.oi{border:1px solid var(--ui-line);border-radius:8px;background:var(--ui-panel)}
.oi.sel{border-color:var(--ui-accent);box-shadow:0 0 0 1px var(--ui-accent)}
.oh{display:grid;grid-template-columns:28px 40px 1fr auto;gap:8px;align-items:center;padding:6px 8px;cursor:pointer}
.oh .n{font:12px var(--ui-mono);color:var(--ui-mute);text-align:right}
.oh .t{width:40px;height:32px;border-radius:4px;background:var(--ui-sunk) center/contain no-repeat;border:1px solid var(--ui-line)}
.oh .d{min-width:0;font-size:12.5px;line-height:1.3}
.oh .d b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.oh .d small{color:var(--ui-mute);font-variant-numeric:tabular-nums}
.oh .flags{display:flex;gap:4px}
.pillui{font-size:10.5px;padding:1px 6px;border-radius:99px;background:var(--ui-sunk);border:1px solid var(--ui-line);color:var(--ui-mute)}
.pillui.hl{background:var(--ui-warn-bg);color:var(--ui-warn);border-color:transparent}
.oe{border-top:1px solid var(--ui-line);padding:10px;display:flex;flex-direction:column;gap:10px;background:var(--ui-sunk);border-radius:0 0 8px 8px}
.oe .f input[type=text],.oe .f input[type=number],.oe .f select,.oe .f textarea{background:var(--ui-panel)}
.oe .col{background:var(--ui-panel)}
.oacts{display:flex;gap:6px;flex-wrap:wrap}
.toolbar{display:flex;gap:6px;flex-wrap:wrap}

.main{overflow:auto;background:var(--ui-desk);position:relative;min-width:0}
.warn{position:sticky;top:0;z-index:3;margin:0;padding:8px 16px;background:var(--ui-warn-bg);color:var(--ui-warn);font-size:13px;border-bottom:1px solid var(--ui-line)}
.desk{padding:28px 24px 64px;display:flex;flex-wrap:wrap;gap:36px 28px;justify-content:center;align-items:flex-start}
.sheetbox{display:flex;flex-direction:column;gap:8px}
.sheetbox .lbl{font-size:12px;color:var(--ui-mute);display:flex;justify-content:space-between;gap:12px}
.sheetbox .lbl b{color:var(--ui-ink);font-weight:500}
.sw{position:relative;box-shadow:0 1px 3px rgba(0,0,0,.18),0 12px 32px rgba(0,0,0,.14);background:#fff}
.sw>.pg{position:absolute;left:0;top:0;transform-origin:0 0}
.zoom{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ui-mute)}
.zoom select{border:1px solid var(--ui-line);background:var(--ui-sunk);border-radius:6px;padding:4px 6px}

.modal{position:fixed;inset:0;background:rgba(10,12,16,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{background:var(--ui-panel);border-radius:12px;max-width:760px;width:100%;max-height:90%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg h2{margin:0;font-size:17px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.tblwrap{overflow-x:auto;border:1px solid var(--ui-line);border-radius:8px}
.tbl{border-collapse:collapse;font-size:12px;width:100%;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--ui-line);text-align:left;white-space:nowrap}
.tbl th{background:var(--ui-sunk);font-weight:600}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.xopt{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.xcard{border:1px solid var(--ui-line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.xcard b{font-weight:600}
.xcard p{margin:0;font-size:12.5px;color:var(--ui-mute)}
.stp{display:flex;align-items:stretch;border:1px solid var(--ui-line);border-radius:6px;background:var(--ui-panel);overflow:hidden}
.stp button{border:0;background:transparent;width:30px;cursor:pointer;font-size:15px;line-height:1;color:var(--ui-ink)}
.stp button:hover{background:var(--ui-sunk)}
.stp input{border:0!important;border-radius:0!important;text-align:center;width:100%;min-width:0;padding:6px 0!important;background:transparent!important;-moz-appearance:textfield}
.stp input::-webkit-inner-spin-button{display:none}
.mini{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ui-mute);font-weight:600}
.box{border:1px solid var(--ui-line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:10px;background:var(--ui-panel)}
.slib{display:flex;gap:6px;flex-wrap:wrap}
.slib button{width:44px;height:44px;border:1px solid var(--ui-line);border-radius:6px;background:var(--ui-sunk) center/contain no-repeat;cursor:pointer}
.slib button[aria-pressed="true"]{border-color:var(--ui-accent);box-shadow:0 0 0 1px var(--ui-accent)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ui-ink);color:var(--ui-panel);padding:9px 16px;border-radius:8px;font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.busy{position:fixed;inset:0;background:rgba(10,12,16,.55);display:flex;align-items:center;justify-content:center;z-index:70;color:#fff;font-weight:500}
#stage{position:fixed;left:0;top:0;z-index:-1;pointer-events:none}

@media (max-width:860px){
  .app{height:auto}
  .body{grid-template-columns:1fr}
  .panel{border-right:0;border-bottom:1px solid var(--ui-line)}
  .pbody{max-height:none}
  .main{min-height:70vh}
  .proj{width:160px}
}

/* ====== PEÇAS IMPRESSAS (valores definidos pelo tema do tabloide) ====== */
.pg{--p:#1f2a78;--a:#ffd100;background:var(--pbg);color:var(--tx);font-family:var(--fb);overflow:hidden;display:flex;flex-direction:column;position:relative;font-synthesis:none;-webkit-font-smoothing:antialiased;line-height:1.1}
.pg *{box-sizing:border-box}
.pg .up{text-transform:uppercase}
.pg .fd{font-family:var(--fd);font-weight:900;letter-spacing:-.01em}
/* banner capa */
.bn{position:relative;flex:none;background:var(--p);color:#fff;overflow:hidden}
.bn.img{background-size:cover;background-position:center}
.bn .bn-in{position:absolute;inset:0;padding:56px 56px 40px;display:flex;flex-direction:column;justify-content:space-between}
.bn .kick{font-family:var(--fd);font-weight:900;font-size:38px;color:#fff;text-transform:uppercase;letter-spacing:.01em}
.bn .ttl{display:inline-block;align-self:flex-start;background:var(--a);color:var(--p);font-family:var(--fd);font-weight:900;font-size:96px;line-height:.9;padding:10px 18px 14px;text-transform:uppercase;margin-top:10px}
.bn .sub{font-size:24px;font-weight:700;margin-top:14px;max-width:560px}
.bn .deco{position:absolute;right:-120px;top:-60px;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(255,255,255,.12),rgba(255,255,255,0) 60%);border:26px solid rgba(255,255,255,.07)}
.bn .selo{position:absolute;right:56px;top:50%;transform:translateY(-50%) rotate(-8deg);width:360px;height:360px;border-radius:50%;background:var(--p);border:10px solid var(--a);box-shadow:0 0 0 14px var(--p),0 0 0 18px rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;text-align:center;padding:28px}
.bn .selo span{font-family:var(--fd);font-weight:900;color:#fff;font-size:72px;line-height:.9;text-transform:uppercase}
.bn .blogo{align-self:flex-start}
/* faixa de título */
.strip{flex:none;height:56px;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:16px}
.strip .st{font-family:var(--fd);font-weight:900;font-size:30px;text-transform:uppercase;font-style:italic}
.strip .ss{font-family:var(--fd);font-weight:900;font-size:24px;color:var(--a);text-transform:uppercase;font-style:italic}
/* grade */
.grid{flex:1;display:grid;min-height:0;padding:14px 18px}
.grid.linhas{gap:0}
.grid.linhas .card{border-right:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.grid.caixas{gap:10px}
.grid.caixas .card{border:1px solid var(--ln);border-radius:var(--r)}
.grid.sombra{gap:12px}
.grid.sombra .card{border-radius:var(--r);box-shadow:0 2px 10px rgba(0,0,0,.12)}
.card{position:relative;display:grid;grid-template-columns:var(--cw,44%) minmax(0,1fr);grid-template-rows:auto 1fr auto;column-gap:.55em;row-gap:.25em;padding:.7em .8em .6em;background:var(--cbg);color:var(--tx);font-size:var(--b,13px);min-width:0;min-height:0;overflow:hidden}
.card.s2{grid-column:span 2}
.card.dest{background:var(--dbg);color:var(--dfg)}
.card.dest .big,.card.dest .rs{color:var(--dfg)}
.c-imgcol{grid-row:1/4;grid-column:1;display:flex;flex-direction:column;gap:.25em;min-height:0;min-width:0}
.c-img{flex:1;position:relative;min-height:0;container-type:inline-size}
.c-img .im{position:absolute;inset:0;background:center/contain no-repeat;transform:scale(var(--ish,1))}
.c-img .ph{position:absolute;inset:0;border:1.5px dashed rgba(127,127,127,.45);border-radius:4px;display:flex;align-items:center;justify-content:center;text-align:center;font:600 .62em/1.2 var(--fb);color:rgba(127,127,127,.8);text-transform:uppercase;letter-spacing:.06em}
.c-obs{flex:none;font-size:calc(.46em*var(--os,1));font-weight:600;line-height:1.2;opacity:.85;position:relative}
.c-info{position:relative}
.card.sel [data-blk]{outline:1px dashed rgba(42,85,229,.7);outline-offset:1px;cursor:move}
.bh{position:absolute;right:calc(var(--hs,14px) / -2);bottom:calc(var(--hs,14px) / -2);width:var(--hs,14px);height:var(--hs,14px);background:#2a55e5;border:2px solid #fff;border-radius:50%;cursor:nwse-resize;z-index:6}
.fitting [data-blk]{left:0!important;top:0!important}
.fitting .bh{display:none}
.sl{position:absolute;z-index:3;display:flex;align-items:center;justify-content:center;text-align:center}
.sl img{width:100%;display:block;pointer-events:none}
.sl span{font-family:var(--fd);font-weight:900;line-height:.92;text-transform:uppercase;overflow-wrap:normal}
.sl-circulo{aspect-ratio:1;border-radius:50%;padding:6%}
.sl-etiqueta{border-radius:.25em}
.sl-etiqueta span{white-space:nowrap;padding:.28em .35em .32em}
.sl.ed{cursor:move}
.sl.ed:hover{outline:2px dashed #2a55e5;outline-offset:2px}
.sl-h{position:absolute;right:calc(var(--hs,14px) / -2);bottom:calc(var(--hs,14px) / -2);width:var(--hs,14px);height:var(--hs,14px);background:#2a55e5;border:2px solid #fff;border-radius:50%;cursor:nwse-resize;display:none}
.sl.ed:hover .sl-h{display:block}
.fitting .sl{display:none}
.fitting .c-img .im{transform:none!important}
.card .c-info{grid-column:2;grid-row:1;display:flex;flex-direction:column;gap:.18em;min-width:0}
.c-cod{font-size:.52em;font-weight:700;letter-spacing:.04em;opacity:.85}
.c-desc{font-family:var(--fd);font-weight:900;font-size:calc(.98em*var(--ds,1));line-height:1.02;overflow-wrap:anywhere}
.c-marca{font-size:.62em;font-weight:700;text-transform:uppercase;opacity:.8}
.c-tag{background:var(--p);color:#fff;font-size:.56em;font-weight:800;padding:.2em .5em;text-transform:uppercase;letter-spacing:.04em;margin-top:.1em}
.card.dest .c-tag{background:var(--dfg);color:var(--dbg)}
.c-price{grid-column:1/3;grid-row:3;justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:.15em;position:relative;z-index:1;font-size:calc(1em*var(--ps,1))}
.pill{background:var(--pill);color:var(--pillt);font-size:.56em;font-weight:800;padding:.22em .5em;text-transform:uppercase;white-space:nowrap}
.big{display:flex;align-items:flex-start;color:var(--pr);font-family:var(--fd);font-weight:900;line-height:.8;white-space:nowrap}
.big .rs{font-size:.9em;margin-top:.55em;margin-right:.15em;font-family:var(--fb);font-weight:900}
.big .int{font-size:4.2em;letter-spacing:-.03em}
.big .cw{display:flex;flex-direction:column;align-items:flex-start;margin-left:.06em}
.big .cents{font-size:1.75em;line-height:.9;margin-top:.08em}
.big .un{font-size:.62em;font-family:var(--fb);font-weight:900;margin-top:var(--ung,.3em);margin-left:var(--ungx,.1em);letter-spacing:.02em}
.pg>.tex{position:absolute;inset:0;pointer-events:none;background-position:center}
.pg.texbg>*:not(.tex){position:relative;z-index:1}
.pg.texbg>.tex{z-index:0}
.pg.textop>.tex{z-index:5}
.c-tot{font-size:.56em;font-weight:700;opacity:.9}
.c-de{font-size:.56em;font-weight:700;text-decoration:line-through;opacity:.8}
.card.dest .pill{background:var(--dfg);color:var(--dbg)}
.bn .txt{max-width:62%}
.card.empty{background:transparent}

async function saveFile(name,blob){

function trimCanvas(c){
  const w=c.width,h=c.height;if(w<8||h<8)return c;
  const d=c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,w,h).data;
  const P=(x,y)=>{const i=(y*w+x)*4;return [d[i],d[i+1],d[i+2],d[i+3]]};
  const cs=[P(0,0),P(w-1,0),P(0,h-1),P(w-1,h-1)],transp=cs.filter(p=>p[3]<20).length>=2;
  const bg=[0,1,2].map(j=>cs.reduce((a,p)=>a+p[j],0)/4);
  const isC=i=>transp?d[i+3]>24:(d[i+3]>24&&Math.abs(d[i]-bg[0])+Math.abs(d[i+1]-bg[1])+Math.abs(d[i+2]-bg[2])>48);
  const rowC=y=>{let n=0;const need=Math.max(2,Math.round(w*.004));for(let x=0;x<w;x++)if(isC((y*w+x)*4)&&++n>=need)return true;return false};
  let top=0,bot=h-1,left=0,right=w-1;
  while(top<h&&!rowC(top))top++;if(top>=h)return c;
  while(bot>top&&!rowC(bot))bot--;
  const colC=x=>{let n=0;const need=Math.max(2,Math.round((bot-top)*.004));for(let y=top;y<=bot;y++)if(isC((y*w+x)*4)&&++n>=need)return true;return false};
  while(left<w-1&&!colC(left))left++;
  while(right>left&&!colC(right))right--;
  const cw=right-left+1,ch=bot-top+1;if(cw*ch>w*h*.94)return c;
  const pad=Math.round(Math.max(cw,ch)*.02),x0=Math.max(0,left-pad),y0=Math.max(0,top-pad),x1=Math.min(w,right+1+pad),y1=Math.min(h,bot+1+pad);
  const o=document.createElement('canvas');o.width=x1-x0;o.height=y1-y0;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);return o;
}
function hasAlpha(c){const d=c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,c.width,c.height).data;for(let i=3;i<d.length;i+=16)if(d[i]<250)return true;return false}
function imgToData(src,max,trim){
  return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,max/Math.max(im.width,im.height));
    let c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    if(trim)c=trimCanvas(c);
    res(hasAlpha(c)?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.9));
  };im.onerror=rej;im.src=src});
}
function readImg(file,max,trim=false){
  return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>imgToData(fr.result,max,trim).then(res,rej);fr.onerror=rej;fr.readAsDataURL(file)});
}

function paginate(){
  const pages=[];let idx=0;const L=S.offers;
  for(let p=0;p<S.lam;p++){
    const g=p===0?S.grid.capa:S.grid.interna,C=g.cols,RW=g.rows,occ=Array.from({length:RW},()=>Array(C).fill(false)),items=[];
    while(idx<L.length){const o=L[idx],sp=Math.min(o.span||1,C),rs=Math.min(o.rspan||1,RW);let pos=null;
      find:for(let r=0;r+rs<=RW;r++)for(let c=0;c+sp<=C;c++){let ok=true;
        for(let y=r;y<r+rs&&ok;y++)for(let x=c;x<c+sp;x++)if(occ[y][x]){ok=false;break}
        if(ok){pos=[r,c];break find}}
      if(!pos)break;
      for(let y=pos[0];y<pos[0]+rs;y++)for(let x=pos[1];x<pos[1]+sp;x++)occ[y][x]=true;
      items.push({o,n:idx+1,sp,rs,r:pos[0]+1,c:pos[1]+1});idx++}
    const free=[];occ.forEach((row,y)=>row.forEach((u,x)=>{if(!u)free.push([y+1,x+1])}));
    pages.push({items,free,used:C*RW-free.length,cap:C*RW});
  }
  return {pages,left:L.length-idx};
}
function parseSel(s,max){
  const out=[];String(s||'').split(/[,;\s]+/).forEach(t=>{if(!t)return;const m=t.match(/^(\d+)-(\d+)$/);
    if(m){for(let i=+m[1];i<=+m[2];i++)out.push(i)}else if(/^\d+$/.test(t))out.push(+t)});
  return out.filter(n=>n>=1&&n<=max);
}

    const cols=+g.dataset.cols,rows=+g.dataset.rows,cs=getComputedStyle(g);
    const gx=parseFloat(cs.columnGap)||0,gy=parseFloat(cs.rowGap)||0;
    const w=(g.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-gx*(cols-1))/cols;
    const h=(g.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-gy*(rows-1))/rows;
    $$('.card:not(.empty)',g).forEach(c=>{
      const sp=+c.dataset.cs||1,rs=+c.dataset.rs||1,cw=w*sp+gx*(sp-1),ch=h*rs+gy*(rs-1),pref=c.dataset.lay;
      const v=pref==='v'||(pref!=='h'&&ch/cw>.85);c.classList.toggle('v',v);
      const b=Math.max(7,v?Math.min(cw*.068,ch*.056):Math.min(Math.min(cw,w*1.3)*.052,ch*.058));
      const ic=c.querySelector('.c-imgcol'),pr=c.querySelector('.c-price');let f=1;
      for(let i=0;i<16;i++){c.style.fontSize=(b*f).toFixed(2)+'px';
        const pw=Math.max(0,...[...pr.children].filter(x=>!x.classList.contains('bh')).map(x=>x.offsetWidth)),inf=c.querySelector('.c-info');
        const bottom=Math.max(ic.offsetTop+ic.offsetHeight,inf.offsetTop+inf.offsetHeight,pr.offsetTop+pr.offsetHeight);
        const bad=bottom>c.clientHeight+1||inf.scrollWidth>inf.clientWidth+1||pw>c.clientWidth*.96||(v&&ic.clientHeight<c.clientHeight*.34);
        if(!bad)break;f*=.93}
    });
  });

}

  desk.innerHTML=nodes.map((n,i)=>{const F=FMT[n.fmt];
    const target={a3:Math.min(avail,1000),a4:Math.min(avail,600),story:Math.min(avail,380),feed:Math.min(avail,460)}[n.fmt];
    const s=target/F.w*UI.zoom;
    return `<div class="sheetbox"><div class="lbl"><b>${esc(n.label)}</b><span>${esc(n.info||'')}</span></div><div class="sw" style="width:${F.w*s}px;height:${F.h*s}px;--hs:${(14/s).toFixed(1)}px" data-s="${s}">${n.html}</div></div>`}).join('')||`<p class="hint" style="padding:40px">Nenhuma peça para mostrar. Informe os números das ofertas no painel ao lado.</p>`;
  $$('.sw',desk).forEach(w=>{const pg=w.firstElementChild;pg.style.transform=`scale(${w.dataset.s})`});
  fitGrids(desk);
  const warn=$('#warn');
  if(UI.mode==='tab'){const {left}=paginate();warn.hidden=!left;warn.textContent=left?`${left} oferta${left>1?'s':''} não coube${left>1?'ram':''} nas ${S.lam} lâminas. Aumente o número de lâminas, mude a grade ou tire destaques duplos.`:''}
  else warn.hidden=true;
}

const FIELDS=[['cod','Código',['codigo','cod','sku','ref','referencia','codproduto','codigoproduto','item','codigointerno']],
  ['desc','Descrição',['descricao','produto','nome','desc','descricaoproduto','nomeproduto','descricaocompleta']],

  ['por','Preço Por',['precopor','por','precopromocional','promocional','promo','oferta','precooferta','precofinal','preco','valor']],

  ['obs','Observação',['obs','observacao','observacoes','info','informacao','nota','ocp','codigoocp']]];
function guessMap(headers){const H=headers.map(norm);const map={};const used=new Set();
  FIELDS.forEach(([k,,syn])=>{let j=H.findIndex((h,x)=>!used.has(x)&&syn.includes(h));
    if(j<0)j=H.findIndex((h,x)=>!used.has(x)&&h&&syn.some(s=>s.length>2&&h.includes(s)));
    if(j>=0){map[k]=j;used.add(j)}});return map}
async function importSheet(file){
  let rows;
  try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array',raw:false});const ws=wb.Sheets[wb.SheetNames[0]];
    rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true}).filter(r=>r.some(c=>String(c).trim()!==''));}
  catch{toast('Não consegui abrir essa planilha. Salve como .xlsx ou .csv e tente de novo.');return}
  if(rows.length<2){toast('A planilha precisa de uma linha de cabeçalho e pelo menos uma oferta.');return}
  let hi=0;for(let r=0;r<Math.min(6,rows.length);r++){if(Object.keys(guessMap(rows[r].map(String))).length>=2){hi=r;break}}
  const headers=rows[hi].map(String),data=rows.slice(hi+1);const map=guessMap(headers);
  const opt=k=>`<select data-f="${k}" id="map-${k}"><option value="">(não usar)</option>${headers.map((h,j)=>`<option value="${j}"${map[k]===j?' selected':''}>${esc(h||'Coluna '+(j+1))}</option>`).join('')}</select>`;
  const m=modal(`<h2>Importar ${data.length} linhas de "${esc(file.name)}"</h2>
    <p class="hint">Confira qual coluna da planilha vai para cada campo. Reconheci automaticamente as que estão marcadas.</p>
    <div class="map">${FIELDS.map(([k,l])=>`<label class="f"><span>${l}</span>${opt(k)}</label>`).join('')}</div>
    <div class="tblwrap" id="prev"></div>
    <label class="chk"><input type="checkbox" id="imgLib" checked> Puxar imagens já guardadas pelo código</label>
    <label class="chk"><input type="checkbox" id="memLib" checked> Puxar layout salvo pelo código (tamanhos, selo, destaque, observação)</label>
    <div class="acts"><button class="btn" data-close>Cancelar</button><button class="btn" id="imAdd">Adicionar ao final</button><button class="btn pri" id="imRep">Substituir as ofertas</button></div>`);
  const cur=()=>{const mp={};$$('[data-f]',m).forEach(s=>{if(s.value!=='')mp[s.dataset.f]=+s.value});return mp};
  const toOffers=mp=>data.map(r=>{const g=k=>mp[k]!=null?r[mp[k]]:'';const o=O(String(g('cod')).trim(),String(g('desc')).trim(),String(g('marca')).trim(),parseBR(g('de')),parseBR(g('por')),String(g('un')||'').trim().toUpperCase());
    o.tag=String(g('tag')||'').trim();o.obs=String(g('obs')||'').trim();const p=parseInt(g('parc'));if(p>1){o.parc=p;o.modo='parcelado'}if(o.de==null&&o.modo==='depor')o.modo='por';
    if(o.de!=null&&o.por!=null&&o.de<=o.por)o.modo='por';return o}).filter(o=>o.desc||o.cod);
  const prev=()=>{const os=toOffers(cur()).slice(0,6);$('#prev',m).innerHTML=`<table class="tbl"><tr><th>Código</th><th>Descrição</th><th>Marca</th><th>De</th><th>Por</th><th>Un.</th></tr>${os.map(o=>`<tr><td>${esc(o.cod)}</td><td>${esc(o.desc.slice(0,44))}</td><td>${esc(o.marca)}</td><td>${fmt(o.de)}</td><td>${fmt(o.por)}</td><td>${esc(o.un)}</td></tr>`).join('')}</table>`};
  prev();m.addEventListener('change',e=>{if(e.target.dataset.f)prev()});
  const go=rep=>{const os=toOffers(cur());let hits=0;
    if($('#imgLib',m).checked)os.forEach(o=>{const k=codKey(o.cod);if(k&&BANK.lib[k]){o.img=BANK.lib[k];hits++}});
    let lays=0;if($('#memLib',m).checked)os.forEach(o=>{const t=o.tag;if(applyMem(o)){lays++;if(t)o.tag=t}});
    if(rep)S.offers=os;else S.offers.push(...os);UI.open=null;m.remove();refresh();
    toast(`${os.length} ofertas importadas${hits?`, ${hits} com imagem do banco`:''}${lays?`, ${lays} com layout salvo`:''}.`)};
  $('#imRep',m).onclick=()=>go(true);$('#imAdd',m).onclick=()=>go(false);
}
async function bulkImgs(files){let hit=0,miss=[];
  for(const f of files){const k=codKey(f.name.replace(/\.[^.]+$/,''));let data;try{data=await readImg(f,1400,S.theme.autoCrop)}catch{miss.push(f.name);continue}
    if(k){BANK.lib[k]=data;bankDirty=true}const os=S.offers.filter(o=>k&&codKey(o.cod)===k);os.forEach(o=>o.img=data);if(os.length)hit++;else miss.push(f.name)}
  refresh();toast(`${hit} de ${files.length} imagens encaixadas pelo código${miss.length?`. Sem oferta correspondente: ${miss.slice(0,3).join(', ')}${miss.length>3?'…':''} (ficaram guardadas no banco)`:''}.`)}

      <label class="chk"><input type="checkbox" id="xMarks"${pp.marks?' checked':''}> Marcas de corte e informações da página</label>
      <button class="btn pri" id="xPdf">Gerar PDF para gráfica</button></div>
     <div class="xcard"><b>PDF digital</b><p>Para mandar no WhatsApp, email ou site. Sem sangria nem marcas, arquivo leve.</p><button class="btn" id="xWeb">Gerar PDF digital</button></div>`:''}
    <div class="xcard"><b>PNG</b><p>${nodes.length>1?'Um .zip com uma imagem por página.':'Uma imagem pronta para postar ou imprimir.'}</p><button class="btn${print?'':' pri'}" id="xPng">Gerar PNG</button></div>

   </div>
   ${print?`<p class="hint">Sangria: o fundo das bordas (banner, faixas e rodapé) é estendido além do corte, então não fica filete branco se a faca desviar. Mantenha textos e preços a pelo menos 5 mm da borda. O PDF sai em RGB; se a gráfica exigir CMYK, me mande o PDF na conversa que eu converto no perfil que ela pedir (ex.: FOGRA39 ou Coated GRACoL).</p>`:''}
   <div class="acts"><button class="btn" data-close>Fechar</button></div>`);
  const prefs=()=>{S.printPrefs={bleed:+($('#xBleed',m)?.value||0),marks:!!$('#xMarks',m)?.checked,dpi:+($('#dpi',m)?.value||300)};persist();return S.printPrefs};

/* sangria: estende a borda da arte para fora do corte (repete a última faixa de pixels) */
function bleedCanvas(src,bpx){
  if(!bpx)return src;const w=src.width,h=src.height,c=document.createElement('canvas');c.width=w+2*bpx;c.height=h+2*bpx;const g=c.getContext('2d');
  g.imageSmoothingEnabled=false;g.drawImage(src,bpx,bpx);
  g.drawImage(src,0,0,w,1,bpx,0,w,bpx);g.drawImage(src,0,h-1,w,1,bpx,h+bpx,w,bpx);
  g.drawImage(src,0,0,1,h,0,bpx,bpx,h);g.drawImage(src,w-1,0,1,h,w+bpx,bpx,bpx,h);
  g.drawImage(src,0,0,1,1,0,0,bpx,bpx);g.drawImage(src,w-1,0,1,1,w+bpx,0,bpx,bpx);g.drawImage(src,0,h-1,1,1,0,h+bpx,bpx,bpx);g.drawImage(src,w-1,h-1,1,1,w+bpx,h+bpx,bpx,bpx);
  return c;
}
/* marcas de corte nos quatro cantos, fora da área de sangria */
function cropMarks(pdf,x0,y0,w,h,bleed,info){
  const off=bleed+1.5,len=5;pdf.setDrawColor(0,0,0);pdf.setLineWidth(.25);
  [[x0,y0],[x0+w,y0],[x0,y0+h],[x0+w,y0+h]].forEach(([x,y],i)=>{const sx=i%2?1:-1,sy=i>1?1:-1;
    pdf.line(x+sx*off,y,x+sx*(off+len),y);pdf.line(x,y+sy*off,x,y+sy*(off+len))});
  if(info){pdf.setFontSize(6);pdf.setTextColor(60,60,60);pdf.text(info,x0,y0+h+bleed+6)}
}
async function renderCanvas(n,dpi){
  const F=FMT[n.fmt];const t=S.theme;await Promise.all([t.fontDisplay,t.fontBody].flatMap(f=>[900,700,400].map(w=>document.fonts.load(`${w} 40px "${f}"`).catch(()=>{}))));await document.fonts.ready;
  const stage=$('#stage');stage.innerHTML=n.html;const el=stage.firstElementChild;fitGrids(stage);
  const scale=F.mm?(F.mm[0]/25.4*dpi)/F.w:1;
  const c=await html2canvas(el,{scale,backgroundColor:'#ffffff',useCORS:true,logging:false,width:F.w,height:F.h,windowWidth:F.w,windowHeight:F.h});
  stage.innerHTML='';return c;
}
async function doExport(kind,dpi,opt){syncMem();
  const nodes=buildNodes(false);if(!nodes.length){toast('Nada para exportar.');return}
  const busy=document.createElement('div');busy.className='busy';document.body.append(busy);
  try{
    if(kind==='pdf'){const {jsPDF}=window.jspdf;let pdf=null;const o=opt||{bleed:0,marks:false},bl=o.bleed||0,slugMm=o.marks?10:0,q=o.web?.8:.95;
      for(let i=0;i<nodes.length;i++){busy.textContent=`Gerando página ${i+1} de ${nodes.length}…`;const n=nodes[i],F=FMT[n.fmt];
        let c=await renderCanvas(n,dpi);const bpx=Math.round(bl/F.mm[0]*c.width);c=bleedCanvas(c,bpx);const img=c.toDataURL('image/jpeg',q);
        const pw=F.mm[0]+2*(bl+slugMm),ph=F.mm[1]+2*(bl+slugMm),ox=slugMm,oy=slugMm;
        const ori=pw>ph?'landscape':'portrait';
        if(!pdf)pdf=new jsPDF({unit:'mm',format:[pw,ph],orientation:ori,compress:true});else pdf.addPage([pw,ph],ori);
        pdf.addImage(img,'JPEG',ox,oy,F.mm[0]+2*bl,F.mm[1]+2*bl,undefined,o.web?'MEDIUM':'FAST');
        if(o.marks){const hoje=new Date().toLocaleDateString('pt-BR');cropMarks(pdf,ox+bl,oy+bl,F.mm[0],F.mm[1],bl,`${S.name} · ${n.label} · ${F.mm[0]}×${F.mm[1]} mm · sangria ${bl} mm · ${dpi} dpi · ${hoje}`)}}
      busy.textContent='Preparando o arquivo…';await saveFile(slug(S.name)+(o.web?'-digital':bl?'-grafica':'')+'.pdf',pdf.output('blob'));
    }else{
      const blobs=[];for(let i=0;i<nodes.length;i++){busy.textContent=`Gerando imagem ${i+1} de ${nodes.length}…`;const c=await renderCanvas(nodes[i],dpi);blobs.push(await new Promise(r=>c.toBlob(r,'image/png')))}
      if(blobs.length===1)await saveFile(`${slug(S.name)}-${nodes[0].name}.png`,blobs[0]);
      else{busy.textContent='Compactando…';const z=new JSZip();blobs.forEach((b,i)=>z.file(`${nodes[i].name}.png`,b));await saveFile(`${slug(S.name)}-${UI.mode==='tab'?'laminas':UI.mode==='soc'?'redes':'pecas'}.zip`,await z.generateAsync({type:'blob'}))}
    }
  }catch(err){console.error(err);toast('A exportação falhou. Tente 150 dpi ou menos páginas por vez.')}
  finally{busy.remove();$('#stage').innerHTML=''}
}
