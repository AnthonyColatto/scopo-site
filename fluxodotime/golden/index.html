<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Materiais Golden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700&family=Allura&family=Great+Vibes&family=Ms+Madi&family=Ephesis&family=Corinthia:wght@400;700&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;600;800&family=Bebas+Neue&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#0a0e1d;--pn:#11172e;--pn2:#18203d;--ln:#273158;--tx:#e9ebf4;--mu:#8e96b6;--au:#d6ae63;--au2:#f0d48e;--rd:#e2626b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:400 13px/1.4 Poppins,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--ln);background:#070a16;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px}
.brand img{height:26px}
.brand b{font-weight:600;letter-spacing:.14em;font-size:11px;color:var(--au);text-transform:uppercase}
.top .nm{background:transparent;border:1px solid transparent;border-radius:4px;padding:5px 8px;min-width:160px;font-weight:500}
.top .nm:hover,.top .nm:focus{border-color:var(--ln);outline:none}
.sp{flex:1}
.btn{background:var(--pn2);border:1px solid var(--ln);border-radius:4px;padding:6px 11px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--au)}
.btn.pri{background:linear-gradient(100deg,#b8873b,#e8c67b 50%,#c49846);color:#121212;border-color:#c9a05c;font-weight:600}
.btn.ghost{background:transparent}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.dan{color:#ff9aa1}
.btn:disabled{opacity:.5;cursor:default}
.app{display:grid;grid-template-columns:230px 1fr 330px;height:calc(100vh - 47px)}
.col{overflow:auto;border-right:1px solid var(--ln);background:var(--pn)}
.col.r{border-right:0;border-left:1px solid var(--ln)}
.sec{padding:12px;border-bottom:1px solid var(--ln)}
.sec h3{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:600;display:flex;align-items:center;justify-content:space-between}
.pecas{display:flex;flex-direction:column;gap:8px}
.pc{display:flex;gap:8px;align-items:center;padding:6px;border:1px solid var(--ln);border-radius:5px;cursor:pointer;background:var(--pn2)}
.pc.on{border-color:var(--au);box-shadow:0 0 0 1px var(--au) inset}
.pc .th{width:54px;height:68px;flex:none;overflow:hidden;position:relative;background:#000;border-radius:2px}
.pc .th>div{position:absolute;left:0;top:0;transform-origin:0 0}
.pc .tt{min-width:0}
.pc .tt b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.pc .tt small{color:var(--mu);font-size:11px}
.lays{display:flex;flex-direction:column;gap:2px}
.ly{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:12px}
.ly:hover{background:var(--pn2)}
.ly.on{background:#2a2a1c;color:var(--au2)}
.ly .ic{width:16px;text-align:center;color:var(--mu);font-size:11px}
.ly .nmL{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ly .lk{background:none;border:0;cursor:pointer;color:var(--mu);padding:0 2px;font-size:12px}
.ly .lk.on{color:var(--au)}
.ly.off .nmL{opacity:.45;text-decoration:line-through}
.addrow{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}
.addrow .btn{justify-content:center;font-size:11.5px;padding:5px 4px}
.mid{position:relative;overflow:hidden;background:#05070f;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--ln);background:var(--pn);flex-wrap:wrap}
.bar .lbl{color:var(--mu);font-size:12px}
.stageWrap{flex:1;position:relative;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:24px}
.board{position:relative;flex:none;box-shadow:0 10px 50px rgba(0,0,0,.6)}
.board>.pg{position:absolute;left:0;top:0;transform-origin:0 0}
.ovl{position:absolute;inset:0;pointer-events:none}
.selbox{position:absolute;border:1.5px solid var(--au);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.selbox .hd{position:absolute;width:12px;height:12px;background:#fff;border:2px solid var(--au);border-radius:2px;pointer-events:auto}
.hd.se{right:-7px;bottom:-7px;cursor:nwse-resize}.hd.nw{left:-7px;top:-7px;cursor:nwse-resize}.hd.ne{right:-7px;top:-7px;cursor:nesw-resize}.hd.sw{left:-7px;bottom:-7px;cursor:nesw-resize}
.hd.e{right:-7px;top:calc(50% - 6px);cursor:ew-resize}.hd.s{bottom:-7px;left:calc(50% - 6px);cursor:ns-resize}
.guide{position:absolute;background:#ff3fb4;pointer-events:none}
.tabs{display:flex;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--pn);z-index:2}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px;cursor:pointer;color:var(--mu);font-weight:500}
.tabs button.on{color:var(--au2);border-bottom-color:var(--au)}
.f{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.f>span{font-size:11.5px;color:var(--mu)}
.f input[type=text],.f input[type=number],.f select,.f textarea,.inp{background:#0b1024;border:1px solid var(--ln);border-radius:4px;padding:6px 8px;width:100%}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--au)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.hint{color:var(--mu);font-size:11.5px;margin:4px 0 8px}
.chk{display:flex;align-items:center;gap:6px;margin-bottom:7px;cursor:pointer;font-size:12.5px}
.cor{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.cor input[type=color]{width:34px;height:28px;border:1px solid var(--ln);border-radius:4px;background:none;padding:1px;cursor:pointer}
.sw{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.3);cursor:pointer;padding:0}
.sw.on{outline:2px solid var(--au);outline-offset:1px}
.seg{display:flex;border:1px solid var(--ln);border-radius:4px;overflow:hidden}
.seg button{flex:1;background:#0b1024;border:0;padding:5px 4px;cursor:pointer;font-size:12px;color:var(--mu)}
.seg button.on{background:var(--au);color:#111;font-weight:600}
.imgpick{display:flex;gap:8px;align-items:center}
.imgpick .pv{width:62px;height:62px;border-radius:4px;border:1px solid var(--ln);background:#000 center/cover no-repeat;flex:none}
.imgpick .pv.ct{background-size:contain}
.lib{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lib .it{aspect-ratio:1;border:1px solid var(--ln);border-radius:4px;background:#1a1f35 center/cover no-repeat;cursor:pointer;position:relative}
.lib .it.ct{background-size:contain;background-color:#2b3150}
.lib .it:hover{border-color:var(--au)}
.lib .it .x{position:absolute;right:-6px;top:-6px;width:18px;height:18px;border-radius:50%;background:var(--rd);color:#fff;border:0;font-size:11px;line-height:18px;padding:0;cursor:pointer;display:none}
.lib .it:hover .x{display:block}
input[type=range]{width:100%;accent-color:var(--au)}
.rg{display:flex;align-items:center;gap:6px}.rg output{min-width:38px;text-align:right;color:var(--mu);font-size:11.5px}
.modalBg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:18px 20px;width:min(640px,100%);max-height:90vh;overflow:auto}
.modal h2{margin:0 0 10px;font-size:18px;font-weight:600}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:8px 0}
.mod{border:1px solid var(--ln);border-radius:6px;padding:10px;cursor:pointer;background:var(--pn2);text-align:left}
.mod.on{border-color:var(--au);box-shadow:0 0 0 1px var(--au) inset}
.mod b{display:block;font-weight:600;margin-bottom:3px}.mod small{color:var(--mu);font-size:11.5px}
.xcard{border:1px solid var(--ln);border-radius:6px;padding:12px;margin-bottom:10px;background:var(--pn2)}
.xcard b{font-weight:600}.xcard p{margin:4px 0 10px;color:var(--mu);font-size:12.5px}
.xcard .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#f3e2b4;color:#111;padding:9px 16px;border-radius:5px;font-weight:500;z-index:300;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.busy{position:fixed;inset:0;background:rgba(5,7,15,.82);z-index:250;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--au2)}
#stage{position:fixed;left:-30000px;top:0}
.olist .oi{border:1px solid var(--ln);border-radius:5px;margin-bottom:6px;background:var(--pn2)}
.empty{color:var(--mu);text-align:center;padding:30px 10px}
.mobileNote{display:none}
@media (max-width:1100px){.app{grid-template-columns:200px 1fr 290px}}
@media (max-width:820px){.app{display:block;height:auto}.col{border:0;border-bottom:1px solid var(--ln)}.mid{height:70vh}.mobileNote{display:block}}

/* ===== peça (renderizada no tamanho real) ===== */
.pg{position:relative;overflow:hidden;background:#fff}
.pg .L{position:absolute;box-sizing:border-box}
.pg .bgimg{position:absolute;inset:0;background-repeat:no-repeat}
.pg .tx{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden}
.pg .tx>.in{white-space:pre-wrap;word-break:break-word}
.pg .tx b,.pg .tx strong{font-weight:700}
.pg .lin{display:flex;align-items:center;width:100%}
.pg .lin>i{flex:1;display:block}
.pg .preco{display:flex;align-items:flex-start;width:100%;height:100%;white-space:nowrap}
.pg .preco .cl{display:flex;flex-direction:column;align-items:flex-start}
.pg .tag{display:flex;align-items:center;justify-content:center;width:100%;height:100%;white-space:nowrap;overflow:hidden}
.pg .canto{position:absolute;border-style:solid;border-width:0}
.pg.edit .L.lock,.pg.edit .L.hid{pointer-events:none}
.pg.edit .L{cursor:move}
.pg.edit .L *{pointer-events:none}
</style>
</head>
<body>
<div class="top">
  <a class="btn ghost" id="voltar" href="../" title="Voltar ao Fluxo do Time">← Fluxo</a>
  <div class="brand"><img src="img/logo-branco.png" alt="Alvorada Golden"><b>Materiais</b></div>
  <input class="nm" id="projNome" title="Nome do projeto" aria-label="Nome do projeto">
  <span class="sp"></span>
  <button class="btn sm" id="undo" title="Desfazer (Ctrl+Z)">↶</button>
  <button class="btn sm" id="redo" title="Refazer (Ctrl+Y)">↷</button>
  <button class="btn" id="novoProj">Novo projeto</button>
  <button class="btn" id="arquivo">Arquivo</button>
  <button class="btn" id="fxSalvar" hidden>Salvar no Fluxo</button>
  <button class="btn" id="fxLista" hidden>Projetos do time</button>
  <button class="btn pri" id="exportar">Exportar</button>
</div>
<div class="app">
  <aside class="col">
    <div class="sec"><h3>Peças <button class="btn sm" id="novaPeca">+ Nova</button></h3><div class="pecas" id="pecas"></div></div>
    <div class="sec"><h3>Camadas</h3><div class="lays" id="lays"></div>
      <div class="addrow">
        <button class="btn" data-add="texto">+ Texto</button><button class="btn" data-add="img">+ Imagem</button><button class="btn" data-add="forma">+ Forma</button>
        <button class="btn" data-add="logo">+ Logo</button><button class="btn" data-add="preco">+ Preço</button><button class="btn" data-add="tag">+ Selo</button>
      </div>
      <p class="hint">Clique na arte para escolher. Arraste para mover, puxe o canto para redimensionar. Setas movem 1 px (Shift = 10). Del apaga, Ctrl+D duplica.</p>
    </div>
  </aside>
  <main class="mid">
    <div class="bar"><span class="lbl" id="fmtLbl"></span><span class="sp" style="flex:1"></span>
      <button class="btn sm" id="zOut" title="Diminuir zoom">−</button><span class="lbl" id="zLbl">100%</span><button class="btn sm" id="zIn" title="Aumentar zoom">+</button><button class="btn sm" id="zFit">Caber</button>
    </div>
    <div class="stageWrap" id="wrap"><div class="board" id="board"></div></div>
  </main>
  <aside class="col r">
    <div class="tabs"><button data-t="rap" class="on">Conteúdo</button><button data-t="cam">Camada</button><button data-t="pag">Página</button><button data-t="lib">Imagens</button></div>
    <div id="painel"></div>
  </aside>
</div>
<div id="stage"></div>
<script src="golden.js"></script>
<script src="../config.js"></script>
<script src="ponte.js"></script>
</body>
</html>
